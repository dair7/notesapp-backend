spring.application.name=notesapp

spring.datasource.url=${DB_URL_NOTES_APP}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

server.port=8080

#JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
#30000
#86400000

jwt.refresh-expiration=604800000

# Admin Seed
admin.email=${ADMIN_EMAIL}
admin.password=${ADMIN_PASSWORD}
admin.nombre=${ADMIN_NOMBRE}

#  URL base de la app (para links en emails)
app.base-url=${APP_BASE_URL:http://localhost:8080}


# Configuracionn de Correo Electronico

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME:nubeart73@gmail.com}
spring.mail.password=${GMAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Redis (rate limiting)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}